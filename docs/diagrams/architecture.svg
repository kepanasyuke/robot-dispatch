<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" width="1240" height="800" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Архитектура robot-dispatch</title>
  <desc id="archDesc">Поток задачи: WMS, API, PostgreSQL, диспетчер, outbox, RabbitMQ, флот ROS2 и consumer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7bab"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .title { font-family: "Segoe UI", system-ui, sans-serif; font-size: 26px; font-weight: 600; fill: #e9f0fb; }
      .subtitle { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #8ea3c4; }
      .box { fill: #141f36; stroke: #27364f; stroke-width: 1.5; }
      .box-api { stroke: #34d399; }
      .box-worker { stroke: #60a5fa; }
      .box-store { stroke: #94a3b8; }
      .box-broker { stroke: #fbbf24; }
      .box-robot { stroke: #a78bfa; }
      .box-ext { fill: #101a2c; stroke: #33445f; stroke-dasharray: 6 5; }
      .label { font-family: "Segoe UI", system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #e9f0fb; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; fill: #9db3d3; }
      .cap { font-family: "Segoe UI", system-ui, sans-serif; font-size: 12.5px; fill: #b9c9e2; }
      .note { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; fill: #8ea3c4; }
      .arrow { stroke: #5b7bab; stroke-width: 1.8; fill: none; }
      .arrow-dashed { stroke: #5b7bab; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
      .arrow-hot { stroke: #34d399; stroke-width: 1.8; fill: none; }
      .tag { font-family: Consolas, "Cascadia Mono", monospace; font-size: 11.5px; fill: #34d399; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1240" height="800" rx="0"/>
  <text class="title" x="40" y="48">robot-dispatch — архитектура</text>
  <text class="subtitle" x="40" y="74">FastAPI · PostgreSQL · RabbitMQ · ROS2 · идемпотентная постановка задач</text>

  <!-- external -->
  <rect class="box box-ext" x="40" y="130" width="200" height="80" rx="14"/>
  <text class="label" x="60" y="164">WMS заказчика</text>
  <text class="mono" x="60" y="188">HTTP · Idempotency-Key</text>

  <rect class="box box-ext" x="40" y="330" width="200" height="80" rx="14"/>
  <text class="label" x="60" y="364">Redis</text>
  <text class="mono" x="60" y="388">leader lock (best-effort)</text>

  <!-- api -->
  <rect class="box box-api" x="290" y="100" width="260" height="170" rx="14"/>
  <text class="label" x="310" y="132">API · FastAPI</text>
  <text class="mono" x="310" y="160">POST /api/v1/tasks</text>
  <text class="mono" x="310" y="182">GET /tasks/{id} · /stats</text>
  <text class="mono" x="310" y="204">/health/ready · X-API-Key</text>
  <text class="mono" x="310" y="244">201 / 200 на реплей</text>

  <!-- dispatcher -->
  <rect class="box box-worker" x="290" y="330" width="260" height="160" rx="14"/>
  <text class="label" x="310" y="362">Dispatcher worker</text>
  <text class="mono" x="310" y="390">SKIP LOCKED · lease</text>
  <text class="mono" x="310" y="412">reaper · watchdog</text>
  <text class="mono" x="310" y="434">outbox relay</text>
  <text class="mono" x="310" y="466">attempt 1/3 → 2/3</text>

  <!-- consumer -->
  <rect class="box box-worker" x="290" y="560" width="260" height="150" rx="14"/>
  <text class="label" x="310" y="592">Consumer worker</text>
  <text class="mono" x="310" y="620">result.* · heartbeat.*</text>
  <text class="mono" x="310" y="642">retry (TTL) → DLQ</text>
  <text class="mono" x="310" y="674">command_id проверка</text>

  <!-- postgres -->
  <rect class="box box-store" x="610" y="100" width="270" height="200" rx="14"/>
  <text class="label" x="630" y="132">PostgreSQL</text>
  <text class="mono" x="630" y="160">tasks · task_events</text>
  <text class="mono" x="630" y="182">robots · robot_capabilities</text>
  <text class="mono" x="630" y="204">outbox_messages</text>
  <text class="mono" x="630" y="238">одна транзакция:</text>
  <text class="mono" x="630" y="260">задача + событие + команда</text>

  <!-- rabbitmq -->
  <rect class="box box-broker" x="610" y="380" width="270" height="220" rx="14"/>
  <text class="label" x="630" y="412">RabbitMQ</text>
  <text class="mono" x="630" y="440">robot.commands (direct)</text>
  <text class="mono" x="630" y="462">robot.events (topic)</text>
  <text class="mono" x="630" y="484">dispatch.results</text>
  <text class="mono" x="630" y="506">dispatch.results.retry</text>
  <text class="mono" x="630" y="528">dispatch.results.dlq</text>
  <text class="mono" x="630" y="562">per-message TTL</text>

  <!-- robots -->
  <rect class="box box-robot" x="930" y="380" width="260" height="150" rx="14"/>
  <text class="label" x="950" y="412">Флот ROS2</text>
  <text class="mono" x="950" y="440">robot-1 … robot-N</text>
  <text class="mono" x="950" y="462">mock_ros2 · симулятор</text>
  <text class="mono" x="950" y="484">дедуп по command_id</text>

  <!-- edges -->
  <path class="arrow" d="M 240 170 H 290" marker-end="url(#arrow)"/>
  <text class="cap" x="246" y="158">POST /tasks</text>

  <path class="arrow" d="M 550 170 H 610" marker-end="url(#arrow)"/>
  <text class="cap" x="556" y="158">1 транзакция</text>

  <path class="arrow" d="M 420 330 L 610 296" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="cap" x="432" y="287">claim / assign</text>

  <path class="arrow" d="M 550 430 H 610" marker-end="url(#arrow)"/>
  <text class="cap" x="556" y="418">publish</text>

  <path class="arrow-hot" d="M 880 430 H 930" marker-end="url(#arrow-hot)"/>
  <text class="cap" x="888" y="418">command.&lt;robot_id&gt;</text>

  <path class="arrow" d="M 930 500 H 880" marker-end="url(#arrow)"/>
  <text class="cap" x="888" y="488">result · heartbeat</text>

  <path class="arrow" d="M 745 600 V 690 H 550" marker-end="url(#arrow)"/>
  <text class="cap" x="566" y="712">result.* · heartbeat.*</text>

  <path class="arrow-dashed" d="M 420 560 V 535 H 595 V 296 H 610" marker-end="url(#arrow)"/>
  <text class="cap" x="600" y="318">status update</text>

  <path class="arrow-dashed" d="M 240 370 H 290" marker-end="url(#arrow)"/>
  <text class="cap" x="246" y="358">leader lock</text>

  <text class="note" x="40" y="756">at-least-once доставка + идемпотентность: повтор команды безопасен по command_id, потеря — восстанавливается lease-reaper'ом.</text>
</svg>
