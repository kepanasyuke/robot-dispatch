<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 880" width="1360" height="880" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Архитектура robot-dispatch</title>
  <desc id="archDesc">Поток задачи: WMS, API, PostgreSQL, диспетчер, outbox, RabbitMQ, флот ROS2 и consumer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7bab"/>
    </marker>
    <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <style>
      .bg { fill: #0b1220; }
      .title { font-family: "Segoe UI", system-ui, sans-serif; font-size: 26px; font-weight: 600; fill: #e9f0fb; }
      .subtitle { font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px; fill: #8ea3c4; }
      .box { fill: #141f36; stroke: #27364f; stroke-width: 1.5; }
      .box-api { stroke: #34d399; }
      .box-worker { stroke: #60a5fa; }
      .box-store { stroke: #94a3b8; }
      .box-broker { stroke: #fbbf24; }
      .box-robot { stroke: #a78bfa; }
      .box-ext { fill: #101a2c; stroke: #33445f; stroke-dasharray: 6 5; }
      .label { font-family: "Segoe UI", system-ui, sans-serif; font-size: 16px; font-weight: 600; fill: #e9f0fb; }
      .mono { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12.5px; fill: #9db3d3; }
      .cap { font-family: "Segoe UI", system-ui, sans-serif; font-size: 12.5px; fill: #b9c9e2; }
      .note { font-family: "Segoe UI", system-ui, sans-serif; font-size: 13px; fill: #8ea3c4; }
      .arrow { stroke: #5b7bab; stroke-width: 1.8; fill: none; }
      .arrow-dashed { stroke: #5b7bab; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
      .arrow-hot { stroke: #34d399; stroke-width: 1.8; fill: none; }
      .tag { font-family: Consolas, "Cascadia Mono", monospace; font-size: 12px; fill: #2dd4bf; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1360" height="880"/>
  <text class="title" x="40" y="52">robot-dispatch — архитектура</text>
  <text class="subtitle" x="40" y="80">FastAPI · PostgreSQL · RabbitMQ · ROS2 · идемпотентная постановка задач</text>

  <!-- external systems -->
  <rect class="box box-ext" x="40" y="150" width="240" height="90" rx="14"/>
  <text class="label" x="62" y="184">WMS заказчика</text>
  <text class="mono" x="62" y="210">HTTP · Idempotency-Key</text>

  <rect class="box box-ext" x="40" y="470" width="240" height="90" rx="14"/>
  <text class="label" x="62" y="504">Redis</text>
  <text class="mono" x="62" y="530">leader lock (best-effort)</text>

  <!-- api -->
  <rect class="box box-api" x="330" y="130" width="290" height="180" rx="14"/>
  <text class="label" x="352" y="164">API · FastAPI</text>
  <text class="mono" x="352" y="192">POST /api/v1/tasks</text>
  <text class="mono" x="352" y="214">GET /tasks/{id} · /stats</text>
  <text class="mono" x="352" y="236">/health/ready · X-API-Key</text>
  <text class="mono" x="352" y="272">201 / 200 на реплей</text>

  <!-- dispatcher -->
  <rect class="box box-worker" x="330" y="390" width="290" height="170" rx="14"/>
  <text class="label" x="352" y="424">Dispatcher worker</text>
  <text class="mono" x="352" y="452">SKIP LOCKED · lease</text>
  <text class="mono" x="352" y="474">reaper · watchdog</text>
  <text class="mono" x="352" y="496">outbox relay</text>
  <text class="mono" x="352" y="528">attempt 1/3 → 2/3</text>

  <!-- consumer -->
  <rect class="box box-worker" x="330" y="640" width="290" height="150" rx="14"/>
  <text class="label" x="352" y="674">Consumer worker</text>
  <text class="mono" x="352" y="702">result.* · heartbeat.*</text>
  <text class="mono" x="352" y="724">retry (TTL) → DLQ</text>
  <text class="mono" x="352" y="756">проверка command_id</text>

  <!-- postgres -->
  <rect class="box box-store" x="700" y="130" width="290" height="220" rx="14"/>
  <text class="label" x="722" y="164">PostgreSQL</text>
  <text class="mono" x="722" y="192">tasks · task_events</text>
  <text class="mono" x="722" y="214">robots · robot_capabilities</text>
  <text class="mono" x="722" y="236">outbox_messages</text>
  <text class="mono" x="722" y="272">одна транзакция:</text>
  <text class="mono" x="722" y="294">задача + событие + команда</text>

  <!-- rabbitmq -->
  <rect class="box box-broker" x="700" y="430" width="290" height="220" rx="14"/>
  <text class="label" x="722" y="464">RabbitMQ</text>
  <text class="mono" x="722" y="492">robot.commands (direct)</text>
  <text class="mono" x="722" y="514">robot.events (topic)</text>
  <text class="mono" x="722" y="536">dispatch.results</text>
  <text class="mono" x="722" y="558">dispatch.results.retry</text>
  <text class="mono" x="722" y="580">dispatch.results.dlq</text>
  <text class="mono" x="722" y="612">per-message TTL</text>

  <!-- robots -->
  <rect class="box box-robot" x="1060" y="430" width="260" height="180" rx="14"/>
  <text class="label" x="1082" y="464">Флот ROS2</text>
  <text class="mono" x="1082" y="492">robot-1 … robot-N</text>
  <text class="mono" x="1082" y="514">mock_ros2 · симулятор</text>
  <text class="mono" x="1082" y="536">дедуп по command_id</text>

  <!-- edges: labels live in the gaps between columns -->
  <path class="arrow" d="M 280 195 H 330" marker-end="url(#arrow)"/>
  <text class="tag" x="286" y="183">POST</text>

  <path class="arrow" d="M 620 180 H 700" marker-end="url(#arrow)"/>
  <text class="tag" x="636" y="168">1 tx</text>

  <path class="arrow" d="M 475 390 L 700 330" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="cap" x="500" y="344">claim / assign</text>

  <path class="arrow" d="M 620 480 H 700" marker-end="url(#arrow)"/>
  <text class="tag" x="626" y="468">publish</text>

  <path class="arrow-hot" d="M 990 475 H 1060" marker-end="url(#arrow-hot)"/>
  <text class="tag" x="996" y="463">command</text>

  <path class="arrow" d="M 1060 560 H 990" marker-end="url(#arrow)"/>
  <text class="tag" x="996" y="548">result</text>

  <path class="arrow" d="M 745 650 V 720 H 620" marker-end="url(#arrow)"/>
  <text class="tag" x="640" y="708">results</text>

  <path class="arrow-dashed" d="M 420 640 V 600 H 686 V 300 H 700" marker-end="url(#arrow)"/>
  <text class="tag" x="500" y="588">status</text>

  <path class="arrow-dashed" d="M 280 515 H 330" marker-end="url(#arrow)"/>
  <text class="tag" x="286" y="503">lock</text>

  <text class="note" x="40" y="836">at-least-once доставка + идемпотентность: повтор команды безопасен по command_id, потеря восстанавливается lease-reaper'ом.</text>
</svg>
