[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-dispatch"
version = "0.1.0"
description = "Fault-tolerant task dispatch service for a ROS2 robot fleet, plus five satellite projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "aio-pika>=9.4",
    "redis>=5.0",
    "httpx>=0.27",
    "grpcio>=1.66",
    "protobuf>=5.27",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
mqtt = ["paho-mqtt>=2.0"]
grpc-tools = ["grpcio-tools>=1.66"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = [
    "src",
    "projects/telemetry-hub/src",
    "projects/ros2-bridge/src",
    "projects/grpc-fleet-api/src",
    "projects/fleet-monitor/src",
    "projects/wms-integration/src",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests", "projects"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "projects", "tests", "mock_ros2"]
extend-exclude = ["*_pb2.py", "*_pb2_grpc.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
files = ["src", "projects", "mock_ros2"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = false
exclude = ["_pb2\\.py$", "_pb2_grpc\\.py$", "(^|/)tests/"]

[[tool.mypy.overrides]]
module = ["grpc_fleet_api.fleet_pb2", "grpc_fleet_api.fleet_pb2_grpc"]
ignore_errors = true
